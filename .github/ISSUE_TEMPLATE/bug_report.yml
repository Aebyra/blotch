name: Bug report
description: Something in Blotch doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Blotch version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and displays
      placeholder: "MacBook Pro 14\" M4 + one external display"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `log show --last 10m --predicate 'subsystem == \"com.aebyra.blotch\"'` and paste the relevant part. Hang reports are in ~/Library/Logs/Blotch."
      render: text
